name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:examples
      # prepack roda npm run build durante o pack
      - run: npm pack
      # valida o artifact: instala o tarball num consumidor limpo e faz smoke de import
      - name: Validate package artifact
        run: |
          set -e
          TARBALL=$(ls *.tgz)
          mkdir -p /tmp/consumer-check && cd /tmp/consumer-check
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$TARBALL" --ignore-scripts
          node --input-type=module -e "import * as m from '@atlashub/amf-content-schema'; if (Object.keys(m).length < 10) throw new Error('exports vazios'); console.log('artifact smoke OK')"
      - name: Publish (secrets ausentes → dry-run)
        if: github.ref_type == 'tag'
        run: |
          if [ -z "${{ secrets.AMF_PACKAGES_PAT }}" ]; then
            echo "AMF_PACKAGES_PAT não configurado; dry-run apenas (npm publish --dry-run)."
            npm publish --dry-run
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.AMF_PACKAGES_PAT }}
